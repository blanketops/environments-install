# Changelog generation:
#   release.yml (triggered separately by the tag push below) used to
#   generate CHANGELOG.md and commit it to main itself -- a race, since it
#   runs asynchronously and can land on main after this job has already
#   merged main back into develop, permanently leaving develop without that
#   commit (confirmed happening on the v0.2.4 release -- develop needed a
#   manual post-hoc sync). Generating and committing it here instead, after
#   tagging and before merging back into develop, means develop is always
#   caught up regardless of release.yml's own timing.
name: Finalize Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to finalize (e.g. v0.0.9)"
        required: true
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Merge release into main
        run: |
          git checkout main
          git pull origin main
          git merge --no-ff origin/release/${{ github.event.inputs.version }} \
            -m "release: merge release/${{ github.event.inputs.version }} into main"
          git push origin main

      - name: Tag release
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Install git-cliff
        run: |
          GITCLIFF_VERSION="2.13.0"
          curl -L "https://github.com/orhun/git-cliff/releases/download/v${GITCLIFF_VERSION}/git-cliff-${GITCLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
          tar xzf git-cliff.tar.gz
          sudo mv "git-cliff-${GITCLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          rm -rf git-cliff.tar.gz "git-cliff-${GITCLIFF_VERSION}"
          git-cliff --version

      - name: Generate CHANGELOG.md
        run: git-cliff --config .cliff.toml --output CHANGELOG.md

      - name: Commit and push changelog
        run: |
          git add CHANGELOG.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(release): update changelog for ${{ github.event.inputs.version }}"
            git push origin main
          else
            echo "No changelog changes to commit"
          fi

      - name: Merge main back into develop
        run: |
          git checkout develop
          git pull origin develop
          git merge --no-ff origin/main \
            -m "chore: sync develop with main after release/${{ github.event.inputs.version }}"
          git push origin develop

      - name: Delete release branch
        run: |
          git push origin --delete release/${{ github.event.inputs.version }}
      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🎉 Release Finalized **Version:** \`${{ github.event.inputs.version }}\`
          ## Completed
          - Merged \`release/${{ github.event.inputs.version }}\` into \`main\`
          - Created Git tag \`${{ github.event.inputs.version }}\`
          - Generated and committed CHANGELOG.md
          - Synced \`main\` back into \`develop\`
          - Deleted release branch
          ## Branch Flow
          -  release/${{ github.event.inputs.version }} ↓ main ↓ develop
          ## Release Tag \`${{ github.event.inputs.version }}\`
          ## Next Steps
          - Pushing the tag triggers the **Release** workflow which publishes the GitHub Release with the installer attached.
          EOF
