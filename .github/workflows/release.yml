# CHANGELOG.md is generated and committed by finalize-release.yml,
# synchronously, before it merges main back into develop -- doing it there
# instead of here closes a race where this workflow (triggered
# asynchronously by the tag push) used to commit the changelog to main
# after finalize-release.yml had already synced develop, leaving develop
# permanently missing that commit.
name: Release
on:
    push:
        tags:
            - "v*"
permissions:
    contents: write
jobs:
    release:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout tag
          uses: actions/checkout@v7
          with:
            fetch-depth: 0

        - name: Install git-cliff
          run: |
              GITCLIFF_VERSION="2.13.0"
              curl -L "https://github.com/orhun/git-cliff/releases/download/v${GITCLIFF_VERSION}/git-cliff-${GITCLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
              tar xzf git-cliff.tar.gz
              sudo mv "git-cliff-${GITCLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
              rm -rf git-cliff.tar.gz "git-cliff-${GITCLIFF_VERSION}"
              git-cliff --version

        - name: Build installer
          run: make build-installer

        - name: Verify installer
          run: |
              test -s dist/install.yaml
              echo "CRDs: $(grep -c '^kind: CustomResourceDefinition' dist/install.yaml)"
              ! grep -q 'controller:latest' dist/install.yaml || { echo "ERROR: unpinned image in installer"; exit 1; }

        # finalize-release.yml already generated and committed CHANGELOG.md
        # to main before tagging -- this just gets onto that tip.
        - name: Checkout main
          run: |
              git checkout main
              git pull origin main

        - name: Generate release notes
          run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v3
          with:
            body_path: RELEASE_NOTES.md
            files: |
                  dist/install.yaml
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Release Summary
          run: |
              cat >> $GITHUB_STEP_SUMMARY <<EOF
              # 📦 GitHub Release Published
              **Version:** \`${{ github.ref_name }}\`
              ## Completed
              - Built \`dist/install.yaml\` from tag ${{ github.ref_name }}
              - Generated release notes from the already-current CHANGELOG.md
              - Published GitHub Release with installer attached
              ## Assets
              - install.yaml ($(du -h dist/install.yaml | cut -f1), $(grep -c '^kind:' dist/install.yaml) resources)
              EOF