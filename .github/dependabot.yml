# Automated dependency updates. GitHub Actions only -- this repo is
# kustomize YAML manifests (no go.mod, no package.json), so github-actions
# (workflow action version pins) is the only ecosystem that applies here.
# PRs target develop, matching every other PR in this repo's branch flow.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
